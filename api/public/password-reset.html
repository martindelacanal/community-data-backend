<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password · Bienestar Community</title>
  <script>
  (() => {
    'use strict';
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    let token = fragment.get('token') || null;
    let language = fragment.get('lang') === 'es' ? 'es' : 'en';
    fragment.delete('token');
    const mode = token ? 'complete' : 'request';
    // The secret stays only in this closure, never in history, storage or a URL request.
    window.history.replaceState(window.history.state, '', window.location.pathname + window.location.search);
    // Mail apps may reuse this tab; fragment-only navigation does not reload HTML.
    window.addEventListener('hashchange', () => {
      if (new URLSearchParams(window.location.hash.slice(1)).has('token')) window.location.reload();
    });
    const messages = {
      en: {
        title: 'Choose a new password', intro: 'Use a password you have not used for this account before.',
        password: 'New password', confirmation: 'Confirm new password',
        hint: 'Use at least 8 characters. Very long passwords or many emoji may exceed the length limit.',
        submit: 'Save new password', saving: 'Saving…', mismatch: 'The passwords do not match.',
        invalid: 'Use at least 8 characters and a shorter password if you have exceeded the length limit.',
        expired: 'This link is invalid, expired or has already been used. Request a new link to continue.',
        unavailable: 'We could not save your password. Check your connection and try again.',
        rate: 'Too many attempts. Wait a few minutes and try again.',
        successTitle: 'Password updated', success: 'Your password has been changed. You can now log in with your new password.',
        username: 'Username: ', login: 'Go to log in', request: 'Request a new link', support: 'Need help?',
        requestTitle: 'Recover password', requestIntro: 'Enter your account’s email or username. We will send you a link to choose a new password.',
        identifier: 'Email or username', identifierInvalid: 'Enter a valid email or username.', send: 'Send link', sending: 'Sending…',
        sentTitle: 'Check your email', sent: 'If these details match an account with a registered email, you will receive a link to reset your password. The link expires in 20 minutes.',
        sentHelp: 'Check your spam folder too. If the email does not arrive or you no longer have access to it, contact Support.',
        requestUnavailable: 'We could not send the request. Check your connection and try again.'
      },
      es: {
        title: 'Elige una nueva contraseña', intro: 'Usa una contraseña que no hayas utilizado antes para esta cuenta.',
        password: 'Nueva contraseña', confirmation: 'Confirma la nueva contraseña',
        hint: 'Usa al menos 8 caracteres. Una contraseña muy larga o con muchos emojis puede superar el límite de longitud.',
        submit: 'Guardar contraseña', saving: 'Guardando…', mismatch: 'Las contraseñas no coinciden.',
        invalid: 'Usa al menos 8 caracteres y acorta la contraseña si superaste el límite de longitud.',
        expired: 'Este enlace no es válido, venció o ya fue utilizado. Solicita uno nuevo para continuar.',
        unavailable: 'No pudimos guardar tu contraseña. Comprueba tu conexión y vuelve a intentarlo.',
        rate: 'Hay demasiados intentos. Espera unos minutos y vuelve a intentarlo.',
        successTitle: 'Contraseña actualizada', success: 'Tu contraseña fue cambiada. Ya puedes iniciar sesión con tu nueva contraseña.',
        username: 'Usuario: ', login: 'Ir a iniciar sesión', request: 'Solicitar un nuevo enlace', support: '¿Necesitas ayuda?',
        requestTitle: 'Recuperar contraseña', requestIntro: 'Ingresa el correo o usuario de tu cuenta. Te enviaremos un enlace para elegir una nueva contraseña.',
        identifier: 'Correo o nombre de usuario', identifierInvalid: 'Ingresa un correo o nombre de usuario válido.', send: 'Enviar enlace', sending: 'Enviando…',
        sentTitle: 'Revisa tu correo', sent: 'Si los datos corresponden a una cuenta con correo registrado, recibirás un enlace para restablecer tu contraseña. El enlace vence en 20 minutos.',
        sentHelp: 'Revisa también la carpeta de spam. Si no llega el correo o ya no tienes acceso a él, contacta con Soporte.',
        requestUnavailable: 'No pudimos enviar la solicitud. Comprueba tu conexión y vuelve a intentarlo.'
      }
    };
    document.addEventListener('DOMContentLoaded', () => {
      const byId = id => document.getElementById(id);
      const form = byId('reset-form');
      const requestForm = byId('request-form');
      const identifier = byId('identifier');
      const requestSubmit = byId('request-submit');
      const password = byId('password');
      const confirmation = byId('confirmation');
      const submit = byId('submit');
      const error = byId('error');
      let busy = false;
      let changed = false;
      let sent = false;
      let errorCode = '';
      let username = '';
      let controller;

      function render() {
        const copy = messages[language];
        document.documentElement.lang = language;
        const title = mode === 'request' ? (sent ? copy.sentTitle : copy.requestTitle) : changed ? copy.successTitle : copy.title;
        document.title = title + ' · Bienestar Community';
        document.querySelectorAll('[data-text]').forEach(element => { element.textContent = copy[element.dataset.text]; });
        byId('title').textContent = title;
        byId('intro').textContent = mode === 'request' ? copy.requestIntro : copy.intro;
        byId('intro').hidden = changed || sent || (mode === 'complete' && !token);
        form.hidden = mode !== 'complete' || changed || !token;
        requestForm.hidden = mode !== 'request' || sent;
        byId('sent').hidden = !sent;
        byId('success').hidden = !changed;
        byId('username').textContent = username ? copy.username + username : '';
        byId('username').hidden = !username;
        error.textContent = errorCode ? copy[errorCode] : '';
        error.hidden = !errorCode;
        submit.textContent = busy ? copy.saving : copy.submit;
        submit.disabled = busy;
        requestSubmit.textContent = busy ? copy.sending : copy.send;
        requestSubmit.disabled = busy;
        form.setAttribute('aria-busy', String(busy));
        requestForm.setAttribute('aria-busy', String(busy));
        byId('english').setAttribute('aria-pressed', String(language === 'en'));
        byId('spanish').setAttribute('aria-pressed', String(language === 'es'));
      }

      byId('english').addEventListener('click', () => { language = 'en'; render(); });
      byId('spanish').addEventListener('click', () => { language = 'es'; render(); });
      requestForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (busy || sent || mode !== 'request') return;
        const value = identifier.value.trim();
        if (!value || value.length > 254) { errorCode = 'identifierInvalid'; render(); identifier.focus(); return; }
        busy = true;
        errorCode = '';
        render();
        controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 30000);
        try {
          const response = await fetch('./request', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: value, language }),
            credentials: 'omit', cache: 'no-store', signal: controller.signal
          });
          const result = await response.json();
          if (response.ok && result.status === 'accepted') {
            sent = true;
            identifier.value = '';
          } else {
            errorCode = response.status === 429 ? 'rate' : response.status === 400 ? 'identifierInvalid' : 'requestUnavailable';
          }
        } catch {
          errorCode = 'requestUnavailable';
        } finally {
          clearTimeout(timer);
          controller = undefined;
          busy = false;
          render();
          if (sent) byId('title').focus();
          else if (errorCode) error.focus();
        }
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (busy || changed || mode !== 'complete') return;
        if (!token) { errorCode = 'expired'; render(); return; }
        if (Array.from(password.value).length < 8 || new TextEncoder().encode(password.value).length > 72) {
          errorCode = 'invalid'; render(); password.focus(); return;
        }
        if (password.value !== confirmation.value) {
          errorCode = 'mismatch'; render(); confirmation.focus(); return;
        }
        busy = true;
        errorCode = '';
        render();
        controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 30000);
        try {
          const response = await fetch('./complete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: password.value }),
            credentials: 'omit', cache: 'no-store', signal: controller.signal
          });
          const result = await response.json();
          if (response.ok && result.status === 'password_changed') {
            token = null;
            password.value = '';
            confirmation.value = '';
            username = typeof result.username === 'string' ? result.username : '';
            changed = true;
          } else if (result.error === 'invalid_or_expired_token') {
            token = null;
            password.value = '';
            confirmation.value = '';
            errorCode = 'expired';
          } else {
            errorCode = response.status === 429 ? 'rate' : result.error === 'invalid_password' ? 'invalid' : 'unavailable';
          }
        } catch {
          errorCode = 'unavailable';
        } finally {
          clearTimeout(timer);
          controller = undefined;
          busy = false;
          render();
          if (changed) byId('title').focus();
          else if (errorCode) error.focus();
        }
      });
      window.addEventListener('pagehide', () => {
        token = null;
        password.value = '';
        confirmation.value = '';
        controller?.abort();
      });
      window.addEventListener('pageshow', () => {
        if (mode === 'complete' && !token && !changed) { errorCode = 'expired'; render(); }
      });
      render();
    });
  })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f7; color: #434543; font: 16px/1.6 system-ui, sans-serif; }
    main { min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; }
    .card { width: min(100%, 480px); padding: 32px; background: #fff; border: 1px solid #dce7e7; border-radius: 16px; }
    .brand { color: #c72f69; font-size: 19px; font-weight: 800; margin: 0 0 24px; }
    .languages { display: flex; gap: 12px; margin-bottom: 24px; }
    .languages button { background: none; border: 1px solid #c5e1e1; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
    .languages button[aria-pressed="true"] { background: #ecf8fa; border-color: #067b91; color: #066a7c; }
    h1 { margin: 0 0 16px; color: #c72f69; font-size: 30px; line-height: 1.2; }
    p { margin: 0 0 20px; }
    form { margin-top: 24px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    input { width: 100%; min-height: 48px; padding: 12px; border: 2px solid #c5e1e1; border-radius: 8px; font: inherit; }
    .field { margin-bottom: 20px; }
    .hint { display: block; font-size: 14px; margin-top: 8px; }
    .primary { width: 100%; min-height: 48px; margin: 4px 0 20px; border: 0; border-radius: 24px; background: #087f96; color: white; font: inherit; font-weight: 700; padding: 12px 18px; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    a { color: #06778b; text-underline-offset: 3px; }
    .link { display: block; padding: 10px 0; }
    .error { padding: 12px; background: #fff2f5; border-left: 3px solid #bd2b56; color: #a62049; }
    .support { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e0e8e8; font-size: 14px; overflow-wrap: anywhere; }
    .support a { display: block; }
    #username { overflow-wrap: anywhere; font-weight: 700; }
    :is(a, button, input):focus-visible { outline: 3px solid #087f96; outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { .card { padding: 24px 20px; } h1 { font-size: 27px; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <p class="brand">Bienestar Community</p>
      <div class="languages" aria-label="Language / Idioma">
        <button id="english" type="button">English</button>
        <button id="spanish" type="button">Español</button>
      </div>
      <h1 id="title" tabindex="-1">Choose a new password</h1>
      <p id="intro" data-text="intro"></p>
      <p id="error" class="error" role="alert" tabindex="-1" hidden></p>
      <form id="request-form" novalidate hidden>
        <div class="field">
          <label for="identifier" data-text="identifier">Email or username</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
        </div>
        <button id="request-submit" class="primary" type="submit" data-text="send">Send link</button>
      </form>
      <div id="sent" role="status" hidden>
        <p data-text="sent"></p>
        <p data-text="sentHelp"></p>
      </div>
      <form id="reset-form" novalidate hidden>
        <div class="field">
          <label for="password" data-text="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint" required>
          <span id="password-hint" class="hint" data-text="hint"></span>
        </div>
        <div class="field">
          <label for="confirmation" data-text="confirmation">Confirm new password</label>
          <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required>
        </div>
        <button id="submit" class="primary" type="submit" data-text="submit">Save new password</button>
      </form>
      <div id="success" role="status" hidden>
        <p data-text="success"></p>
        <p id="username" hidden></p>
        <a class="link" href="https://bienestarcommunity.org/home" data-text="login">Go to log in</a>
      </div>
      <a class="link" href="./open" data-text="request">Request a new link</a>
      <div class="support"><span data-text="support">Need help?</span>
        <a href="mailto:community@bienestariswellbeing.org">community@bienestariswellbeing.org</a>
      </div>
      <noscript><p>Enable JavaScript to reset your password. / Activa JavaScript para restablecer tu contraseña.</p></noscript>
    </section>
  </main>
</body>
</html>
